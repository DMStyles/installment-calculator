name: installment_calculator
description: A BNPL installment calculator for Koko, PayZy and MintPay.

publish_to: 'none'

version: 1.6.2+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  http: ^1.2.0
  package_info_plus: ^8.0.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  # Firebase
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  cloud_firestore: ^5.6.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#f09054"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logos/
