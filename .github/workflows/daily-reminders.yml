name: Daily Installment Reminders

on:
  schedule:
    # 9:00 AM Sri Lanka Time is 3:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  send-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install firebase-admin

      - name: Run check-reminders script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/check-reminders.js
