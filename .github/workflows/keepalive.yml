name: Keepalive Workflow

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month to prevent GitHub from disabling scheduled actions
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive-job:
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keepalive Workflow Action
        uses: gautamkrishnar/keepalive-workflow@v2
