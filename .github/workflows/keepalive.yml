name: Keepalive Workflow

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month to prevent GitHub from disabling scheduled actions
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive-job:
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update keepalive timestamp
        run: |
          echo "$(date -u)" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keepalive scheduled workflow [skip ci]"
          git push
